input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Logs already arrive as structured JSON (via logstash-logback-encoder), so no
  # grok/parsing is needed - this stage is a placeholder for future enrichment
  # (e.g. GeoIP on a client IP field) rather than an empty formality.
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "transaction-platform-logs-%{+YYYY.MM.dd}"
  }
}
